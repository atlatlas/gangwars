services:
  backend:
    build:
      context: ./backend
    container_name: gangwars-backend
    restart: unless-stopped
    volumes:
      - gangwars-data:/app/data
    environment:
      - PORT=3006
    expose:
      - "3006"

  frontend:
    build:
      context: ./frontend
    container_name: gangwars-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:3006
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: gangwars-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  gangwars-data:
