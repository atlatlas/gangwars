services:
  backend:
    build:
      context: ./backend
    container_name: gangwars-backend
    restart: unless-stopped
    volumes:
      - gangwars-data:/app/data
    environment:
      - PORT=3006
    expose:
      - "3006"

  frontend:
    build:
      context: ./frontend
    container_name: gangwars-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:3006
    expose:
      - "3000"

volumes:
  gangwars-data:
